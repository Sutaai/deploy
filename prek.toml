[[repos]]
repo = "builtin"

hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "end-of-file-fixer" },
  { id = "check-json" },
  { id = "check-jsonc" },
  { id = "pretty-format-json", args = [
    "--autofix",
    "--indent=2",
  ] },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "mixed-line-ending" },
  { id = "detect-private-key", exclude = "tests/README.md$" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8"               #v4.4.0

hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]

[[repos]]
repo = "https://codeberg.org/Sutaai/Ragers"
rev = "653d7a590017cd47faee919aaa151802d565580a"

hooks = [{ id = "check-decrypted-files-ragers" }]
