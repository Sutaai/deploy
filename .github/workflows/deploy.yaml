name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and connect to Netbird network
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird up --setup-key="${{ secrets.NETBIRD_SETUP_KEY }}"

      - name: Configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          mkdir ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2395 100.127.176.192 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

        # eval $(ssh-agent -s)
        # echo "SSH agent started with PID: $SSH_AGENT_PID"

      - name: Install mise and tools
        timeout-minutes: 5
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - name: Run Ansible - Push stacks
        env:
          ANSIBLE_SSH_AGENT: auto
          ANSIBLE_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: mise exec -- ansible-playbook -i ./src/ansible/inventory.yml ./src/ansible/playbooks/push-stacks.yaml
