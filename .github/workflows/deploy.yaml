name: Deploy

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install mise
        timeout-minutes: 3
        uses: jdx/mise-action@v5.1.2

      - name: Install tools
        timeout-minutes: 5
        run: mise install --yes
