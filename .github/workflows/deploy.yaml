name: Deploy

on:
  workflow_dispatch:


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and connect to Netbird network
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sh
          netbird up --setup-key="${{ secrets.NETBIRD_SETUP_KEY }}"

      - name: Configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
          mkdir ~/.ssh
          echo "Adding SSH key"
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Adding host to known hosts"
          echo "${{ vars.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install mise and tools
        timeout-minutes: 5
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Create identity file
        run: |
          echo "${{ secrets.AGE_IDENTITY_NOT_PQ }}" >> .identity
          chmod 600 .identity

      - name: Decrypt files
        run: ragers --no-prompt decrypt

      - name: Run Ansible - Push Eleutheria
      # For now, I'll only test with a single stack, then I'll upgrade to multiples
        env:
          ANSIBLE_SSH_AGENT: auto
          ANSIBLE_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: mise exec -- ansible-playbook -i ./src/ansible/inventory.yaml ./src/ansible/playbooks/push-stacks.yaml
