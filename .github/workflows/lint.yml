name: Lint files

on:
  push:
    paths:
      - src/ansible/playbooks/**/*

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mise and tools
        timeout-minutes: 5
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Install Galaxy requirements
        run: ansible-galaxy install -r src/ansible/galaxy-requirements.yaml

      - name: Run ansible-lint
        # v26.4.0
        run: mise exec -- ansible-lint --project-dir src/ansible -c src/ansible/.ansible-lint.yaml
