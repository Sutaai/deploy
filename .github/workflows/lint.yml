name: Lint files

on:
  push:
    paths:
      - src/ansible/playbooks/**/*

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install mise and tools
        timeout-minutes: 5
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          mise_env: dev

      - name: Install Galaxy requirements
        run: ansible-galaxy install -r src/ansible/galaxy-requirements.yaml

      - name: Run ansible-lint
        # v26.4.0
        run: mise exec -- ansible-lint --project-dir src/ansible -c src/ansible/.ansible-lint.yaml
