---
- name: Deploy Rclone
  hosts: [hunter]

  tasks:
    - name: Ensure rclone is installed
      ansible.builtin.apt:
        name: rclone
        state: present
        update_cache: true

    - name: Upload configuration file
      ansible.builtin.copy:
        src: src/rclone/hunter.conf
        dest: /home/anna/.config/rclone/rclone.conf
        owner: foo
        group: foo
        mode: u=rw,g=,o=
