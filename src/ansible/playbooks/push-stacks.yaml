---
- name: Deploy Rclone
  hosts: [hunter]

  tasks:
    - name: Create Eleutheria stack folder
      ansible.builtin.file:
        path: ~/stacks/eleutheria
        state: directory
        owner: deploy
        group: deploy
        mode: '0600'

    - name: Copy Eleutheria stack
      ansible.builtin.copy:
        src: ./src/stacks/eleutheria
        dest: ~/stacks/eleutheria
        owner: deploy
        group: deploy
        mode: '0600'
