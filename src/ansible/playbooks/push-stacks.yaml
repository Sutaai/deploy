- name: Deploy Eleutheria (WIP for stacks)
  hosts:
    - hunter

  tasks:
    - name: Check if .age files are present
      become: false
      delegate_to: localhost
      block:
        - name: Collect .age file
          ansible.builtin.find:
            paths: "{{ root }}/src/stacks"
            patterns: "*.age"
            recurse: true
            file_type: file
          register: result

        - name: Check no .age files exist
          ansible.builtin.assert:
            that: result.files | length == 0
            fail_msg: >
              {{ result.files | length }} .age file(s) on controller:
              {% for f in result.files %}- {{ f.path }}{% endfor %}

    - name: Let's try Eleutheria
      ansible.builtin.include_role:
        name: push-stack
      vars:
        stack: eleutheria
        owner: deploy
