---
- name: Deploy Eleutheria (WIP for stacks)
  hosts: [hunter]

  tasks:
    - name: Create Eleutheria stack folder
      ansible.builtin.file:
        path: ~/stacks/eleutheria
        state: directory
        owner: deploy
        group: deploy
        mode: '0700'

    - name: Copy Eleutheria stack
      ansible.builtin.copy:
        src: "{{ root }}/src/stacks/eleutheria"
        dest: ~/stacks/
        owner: deploy
        group: deploy
        mode: '0600'

    - name: Pull images
      community.docker.docker_compose_v2_pull:
        project_src: ~/stacks/eleutheria

    - name: Recreate project
      community.docker.docker_compose_v2:
        project_src: ~/stacks/eleutheria
        state: present
        recreate: always
        remove_orphans: true
