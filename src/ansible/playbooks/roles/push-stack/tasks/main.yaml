- name: Create stack folder
  ansible.builtin.file:
    path: "{{ deposit_location }}"
    state: directory
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0700'

- name: Copy stack
  ansible.builtin.copy:
    src: "{{ root }}/src/stacks/{{ stack }}/"
    dest: "{{ deposit_location }}"
    owner: "{{ owner }}"
    group: "{{ owner }}"
    mode: '0600'

- name: Pull images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ deposit_location }}"

- name: Recreate project
  community.docker.docker_compose_v2:
    project_src: "{{ deposit_location }}"
    state: present
    recreate: always
    remove_orphans: true
