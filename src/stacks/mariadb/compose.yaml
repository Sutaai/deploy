name: mariadb

services:
  db:
    restart: unless-stopped
    image: mariadb:13@sha256:f4054da26e3a9dd6c8b5cc97363e544408b15c0fb369d7359c25dc04826eb6e1
    environment:
      MARIADB_ROOT_PASSWORD: $MARIADB_ROOT_PASSWORD
      MARIADB_AUTO_UPGRADE: 1

    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - 127.0.0.1:3306:3306
    networks:
      access-mariadb:

networks:
  access-mariadb:

volumes:
  mariadb-data:
